<title>DumpWatch STL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: operations console. Map fills the left; a ranked work queue and site file sit on the right. */
:root{
 --bg:#eef0ee; --panel:#ffffff; --ink:#1c2226; --muted:#5b666d; --rule:#d7dbd8; --sunk:#f5f6f4;
 --low:#d9dcd4; --t1:#e9a640; --t2:#cf5a2c; --t3:#7d1d22; --watch:#2f6f8f; --road:#b9c0bc; --nb:#9aa39e;
 --accent:#cf5a2c; --good:#2e7d4f;
 --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Public Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121619;--panel:#1b2125;--ink:#e6e9e7;--muted:#9aa5ab;--rule:#2d353a;--sunk:#161b1e;--low:#2a3236;--t1:#c98a2f;--t2:#ea6a3b;--t3:#ffb08a;--watch:#6fb3d4;--road:#3a4449;--nb:#56626a;--accent:#ea6a3b;--good:#5fbf86;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121619;--panel:#1b2125;--ink:#e6e9e7;--muted:#9aa5ab;--rule:#2d353a;--sunk:#161b1e;--low:#2a3236;--t1:#c98a2f;--t2:#ea6a3b;--t3:#ffb08a;--watch:#6fb3d4;--road:#3a4449;--nb:#56626a;--accent:#ea6a3b;--good:#5fbf86;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;padding-block:18px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rule);background:var(--panel)}
.brand{font:700 30px/1 var(--display);letter-spacing:.01em;margin:0}
.brand small{display:block;font:500 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.kpis{display:flex;flex-wrap:wrap;gap:12px 20px}
.kpi{flex:1 1 110px;min-width:0}
@media (max-width:600px){.hint{display:none}.brand{font-size:26px}.kpi b{font-size:20px}}
.kpi b{display:block;font:600 24px/1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--rule);min-width:0}
.mapwrap{position:relative}
.maptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--rule)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px var(--body);border:1px solid var(--rule);background:transparent;color:var(--muted);padding:5px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.chip i{width:10px;height:10px;display:inline-block}
.chip:focus-visible,.row:focus-visible,.tab:focus-visible,.zbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
canvas{display:block;width:100%;height:auto;max-width:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;border:1px solid var(--rule);background:var(--panel)}
.zbtn{width:34px;height:34px;border:0;background:transparent;color:var(--ink);font:600 18px var(--body);cursor:pointer}
.zbtn+.zbtn{border-top:1px solid var(--rule)}
.hint{position:absolute;left:12px;bottom:12px;font:11px var(--mono);color:var(--muted);background:var(--panel);padding:3px 6px;border:1px solid var(--rule)}
.side{display:flex;flex-direction:column;max-height:calc(100vh - 140px);min-height:560px}
@media (max-width:980px){.side{max-height:none}}
.tabs{display:flex;border-bottom:1px solid var(--rule)}
.tab{flex:1;font:600 13px var(--body);padding:11px 8px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{overflow:auto;flex:1}
.lede{font-size:13px;color:var(--muted);padding:12px 14px;margin:0;border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rule);cursor:pointer;background:transparent;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit}
.row:hover{background:var(--sunk)}
.row.sel{background:var(--sunk);box-shadow:inset 3px 0 0 var(--accent)}
.rk{font:600 20px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--muted)}
.rt{min-width:0}
.rt b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span{font-size:12px;color:var(--muted)}
.pill{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border:1px solid currentColor;white-space:nowrap}
.pill.C{color:var(--t3)}.pill.H{color:var(--t2)}.pill.W{color:var(--watch)}
.trend{font:500 12px var(--mono);white-space:nowrap}
.up{color:var(--accent)}.down{color:var(--good)}
.file{padding:14px;display:grid;gap:16px}
.back{font:500 12px var(--mono);background:none;border:0;color:var(--muted);cursor:pointer;padding:0;justify-self:start}
.file h2{font:700 28px/1 var(--display);margin:4px 0 2px;text-wrap:balance}
.meta{font-size:13px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.facts div{background:var(--panel);padding:10px}
.facts b{display:block;font:600 22px/1 var(--display);font-variant-numeric:tabular-nums}
.facts span{font-size:11px;color:var(--muted)}
h3{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.act{display:grid;gap:8px}
.act div{border:1px solid var(--rule);padding:10px 12px}
.act b{font:600 13px var(--body);display:block;margin-bottom:2px}
.act p{margin:0;font-size:13px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
td{padding:5px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td.n{text-align:right;font-family:var(--mono);padding-left:10px;white-space:nowrap}
svg text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.how{padding:14px;display:grid;gap:16px;font-size:14px}
.how p{margin:0;max-width:62ch}
.vt td{padding:7px 0}
.note{font-size:12px;color:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font:12px/1.4 var(--mono);padding:6px 8px;z-index:5;max-width:260px}
</style>

<header class="top">
 <div><h1 class="brand">DumpWatch STL<small>Illegal dumping risk and enforcement queue · data through <span id="asof"></span></small></h1></div>
 <div class="kpis" id="kpis"></div>
</header>

<main class="grid">
 <section class="panel mapwrap" aria-label="Risk map">
  <div class="maptools">
   <div class="chips" role="group" aria-label="Map layers">
    <button class="chip" id="L-cells" aria-pressed="true"><i style="background:var(--t2)"></i>Risk blocks</button>
    <button class="chip" id="L-sites" aria-pressed="true"><i style="background:var(--t3)"></i>Top 40 sites</button>
    <button class="chip" id="L-watch" aria-pressed="true"><i style="background:var(--watch)"></i>Watch list</button>
   </div>
   <div class="chips" aria-hidden="true">
    <span class="chip" style="cursor:default"><i style="background:var(--t1)"></i>Elevated</span>
    <span class="chip" style="cursor:default"><i style="background:var(--t2)"></i>High</span>
    <span class="chip" style="cursor:default"><i style="background:var(--t3)"></i>Critical</span>
   </div>
  </div>
  <canvas id="map" aria-label="Map of St. Louis showing dumping risk by block"></canvas>
  <div class="hint">Drag to pan · scroll or +/− to zoom · click a marker</div>
  <div class="zoom"><button class="zbtn" id="zin" aria-label="Zoom in">+</button><button class="zbtn" id="zout" aria-label="Zoom out">−</button><button class="zbtn" id="zreset" aria-label="Reset view" style="font-size:13px">⟲</button></div>
 </section>

 <aside class="panel side">
  <div class="tabs" role="tablist">
   <button class="tab" role="tab" id="t-act" aria-selected="true">Act here next</button>
   <button class="tab" role="tab" id="t-watch" aria-selected="false">Watch list</button>
   <button class="tab" role="tab" id="t-how" aria-selected="false">Does it work?</button>
  </div>
  <div class="pane" id="pane"></div>
 </aside>
</main>
<div class="tip" id="tip" hidden></div>

<script>
const D=__DATA__;
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('en-US');
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const clean=s=>String(s).replace(/\s+/g,' ').replace(/ Av$/,' Ave').trim();
const V=D.val.validation_2026;
$('asof').textContent=new Date(D.asof+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
$('kpis').innerHTML=[[D.tiers.Critical+D.tiers.High,'critical + high-risk blocks'],[Math.round(V.model[1])+'%','of 2026 dumping caught by top 5% of blocks'],[D.watch.length,'quiet blocks on the watch list']]
 .map(([b,s])=>`<div class="kpi"><b>${b}</b><span>${s}</span></div>`).join('');

/* ---------- map ---------- */
const cv=$('map'),ctx=cv.getContext('2d');
const lats=[],lons=[];D.nb.forEach(n=>n.rings.forEach(r=>r.forEach(([x,y])=>{lons.push(x);lats.push(y)})));
const B={lo0:Math.min(...lons),lo1:Math.max(...lons),la0:Math.min(...lats),la1:Math.max(...lats)},K=Math.cos(38.63*Math.PI/180);
let W=0,H=0,base=1,view={k:1,tx:0,ty:0},layers={cells:true,sites:true,watch:true},sel=null,hits=[];
function size(){const w=cv.parentElement.clientWidth,h=Math.max(420,Math.min(window.innerHeight-200,w*1.05));
 W=w;H=h;const dpr=window.devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
 base=Math.min((W-24)/((B.lo1-B.lo0)*K),(H-24)/(B.la1-B.la0));draw()}
function P(lo,la){const s=base*view.k;const cx=W/2+((lo-(B.lo0+B.lo1)/2)*K*s)+view.tx,cy=H/2-((la-(B.la0+B.la1)/2)*s)+view.ty;return[cx,cy]}
function draw(){
 ctx.fillStyle=css('--panel');ctx.fillRect(0,0,W,H);hits=[];
 const s=base*view.k,cw=0.00225*K*s,ch=0.00176*s;
 // neighborhoods fill
 ctx.lineWidth=1;ctx.strokeStyle=css('--nb');ctx.fillStyle=css('--sunk');
 D.nb.forEach(n=>n.rings.forEach(r=>{ctx.beginPath();r.forEach(([x,y],i)=>{const[a,b]=P(x,y);i?ctx.lineTo(a,b):ctx.moveTo(a,b)});ctx.closePath();ctx.fill()}));
 if(layers.cells){const col={L:css('--low'),E:css('--t1'),H:css('--t2'),C:css('--t3')};
  D.cells.forEach(c=>{if(c[3]==='L'&&c[4]===0)return;const[x,y]=P(c[1],c[0]);if(x<-10||y<-10||x>W+10||y>H+10)return;ctx.fillStyle=col[c[3]];ctx.globalAlpha=c[3]==='L'?.7:1;ctx.fillRect(x-cw/2,y-ch/2,cw+.5,ch+.5)});ctx.globalAlpha=1}
 ctx.strokeStyle=css('--road');ctx.lineWidth=view.k>2?1.4:.9;
 D.roads.forEach(l=>{ctx.beginPath();l.forEach(([x,y],i)=>{const[a,b]=P(x,y);i?ctx.lineTo(a,b):ctx.moveTo(a,b)});ctx.stroke()});
 ctx.strokeStyle=css('--nb');ctx.lineWidth=.8;
 D.nb.forEach(n=>n.rings.forEach(r=>{ctx.beginPath();r.forEach(([x,y],i)=>{const[a,b]=P(x,y);i?ctx.lineTo(a,b):ctx.moveTo(a,b)});ctx.closePath();ctx.stroke()}));
 if(view.k>=2.2){ctx.fillStyle=css('--muted');ctx.font='11px "IBM Plex Mono",monospace';ctx.textAlign='center';
  D.nb.forEach(n=>{const r=n.rings[0];let sx=0,sy=0;r.forEach(([x,y])=>{sx+=x;sy+=y});const[a,b]=P(sx/r.length,sy/r.length);if(a>0&&a<W&&b>0&&b<H)ctx.fillText(n.name.toUpperCase(),a,b)})}
 if(layers.watch)D.watch.forEach((w,i)=>{const[x,y]=P(w.lon,w.lat),r=6;ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillStyle=css('--panel');ctx.strokeStyle=css('--watch');ctx.lineWidth=2;ctx.fillRect(-r,-r,2*r,2*r);ctx.strokeRect(-r,-r,2*r,2*r);ctx.restore();hits.push({x,y,r:10,type:'w',i})});
 if(layers.sites)D.sites.slice().reverse().forEach(st=>{const[x,y]=P(st.lon,st.lat),on=sel&&sel.type==='s'&&sel.i===st.rank-1,r=on?13:st.rank<=10?11:9;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=on?css('--ink'):css('--t3');ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=css('--panel');ctx.stroke();
  ctx.fillStyle=on?css('--panel'):'#fff';ctx.font=`600 ${r>9?11:10}px "Public Sans",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(st.rank,x,y+.5);ctx.textBaseline='alphabetic';
  hits.push({x,y,r:r+3,type:'s',i:st.rank-1})});
 if(sel&&sel.type==='w'){const w=D.watch[sel.i],[x,y]=P(w.lon,w.lat);ctx.beginPath();ctx.arc(x,y,14,0,7);ctx.strokeStyle=css('--ink');ctx.lineWidth=2;ctx.stroke()}
}
function zoomAt(f,mx,my){const k=Math.min(14,Math.max(1,view.k*f));f=k/view.k;view.tx=(view.tx-(mx-W/2))*f+(mx-W/2);view.ty=(view.ty-(my-H/2))*f+(my-H/2);view.k=k;if(k===1){view.tx=0;view.ty=0}draw()}
function focus(lo,la,k){view.k=k;view.tx=0;view.ty=0;const[x,y]=P(lo,la);view.tx=W/2-x;view.ty=H/2-y;draw()}
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.deltaY<0?1.25:0.8,e.clientX-r.left,e.clientY-r.top)},{passive:false});
let drag=null,moved=false;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty};moved=false;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;if(moved){view.tx=drag.tx+dx;view.ty=drag.ty+dy;draw()}return}
 const h=hit(mx,my),tip=$('tip');if(!h){tip.hidden=true;return}tip.hidden=false;tip.style.left=Math.min(e.clientX+12,innerWidth-270)+'px';tip.style.top=e.clientY+12+'px';
 if(h.type==='s'){const s=D.sites[h.i];tip.textContent=`#${s.rank} ${s.nb} · ${s.n_recent} reports since 2022`}else{const w=D.watch[h.i];tip.textContent=`Watch: ${w.nb} · no reports in 3 yrs · ${w.p}% est. chance of first report`}});
cv.addEventListener('pointerup',e=>{const r=cv.getBoundingClientRect();if(!moved){const h=hit(e.clientX-r.left,e.clientY-r.top);if(h){h.type==='s'?openSite(h.i):openWatch(h.i)}}drag=null});
cv.addEventListener('pointerleave',()=>$('tip').hidden=true);
function hit(mx,my){let best=null,bd=1e9;hits.forEach(h=>{const d=Math.hypot(h.x-mx,h.y-my);if(d<h.r&&d<bd){bd=d;best=h}});return best}
$('zin').onclick=()=>zoomAt(1.5,W/2,H/2);$('zout').onclick=()=>zoomAt(1/1.5,W/2,H/2);$('zreset').onclick=()=>{view={k:1,tx:0,ty:0};draw()};
['cells','sites','watch'].forEach(k=>{const b=$('L-'+k);b.onclick=()=>{layers[k]=!layers[k];b.setAttribute('aria-pressed',layers[k]);draw()}});

/* ---------- side panel ---------- */
let tab='act';
const trend=s=>{const d=s.last12-s.prev12;return d>0?`<span class="trend up">▲ ${d}</span>`:d<0?`<span class="trend down">▼ ${-d}</span>`:`<span class="trend">–</span>`};
function list(){
 sel=null;draw();
 if(tab==='act'){$('pane').innerHTML=`<p class="lede">The 40 blocks most likely to be dumped on next, ranked by the model. Arrows compare the last 12 months with the 12 before.</p>`+
  D.sites.map((s,i)=>`<button class="row" data-i="${i}"><span class="rk">${s.rank}</span><span class="rt"><b>${s.nb} · ${clean(s.addrs[0]?s.addrs[0][0]:'')}</b><span>Ward ${s.ward} · ${s.n_recent} reports since 2022 · ${s.actions.map(a=>a[0]).join(', ')}</span></span>${trend(s)}</button>`).join('');
  $('pane').querySelectorAll('.row').forEach(r=>r.onclick=()=>openSite(+r.dataset.i))}
 else if(tab==='watch'){$('pane').innerHTML=`<p class="lede">Blocks with no dumping reports for three years, but surrounded by the conditions that came before dumping elsewhere: city-owned (LRA) land and vacant buildings. Act before they become hotspots.</p>`+
  D.watch.map((w,i)=>`<button class="row" data-i="${i}"><span class="rk" style="color:var(--watch)">◆</span><span class="rt"><b>${w.nb}</b><span>${w.lra} LRA parcels · ${w.vac_bldg} vacant buildings · ${w.vac_lot} vacant lots nearby</span></span><span class="pill W">${w.p}%</span></button>`).join('');
  $('pane').querySelectorAll('.row').forEach(r=>r.onclick=()=>openWatch(+r.dataset.i))}
 else how();
}
function bars(vals,labels,color,h=70){const W2=360,mx=Math.max(1,...vals),bw=W2/vals.length;
 return `<svg viewBox="0 0 ${W2} ${h+16}" width="100%" role="img">`+vals.map((v,i)=>{const bh=(h-12)*v/mx;return `<rect x="${i*bw+bw*.15}" y="${h-bh}" width="${bw*.7}" height="${bh}" fill="${color}"><title>${labels[i]}: ${v}</title></rect>${v?`<text x="${i*bw+bw/2}" y="${h-bh-3}" text-anchor="middle">${v}</text>`:''}<text x="${i*bw+bw/2}" y="${h+12}" text-anchor="middle">${labels[i]}</text>`}).join('')+'</svg>'}
function openSite(i){
 const s=D.sites[i];sel={type:'s',i};tabSet('act',false);focus(s.lon,s.lat,Math.max(view.k,4));
 const yrs=[];for(let y=2018;y<=2026;y++)yrs.push(s.years[y]||0);
 const vb=s.vb_list.filter(v=>v[1]>0);
 const mix=Object.entries(s.mix);
 $('pane').innerHTML=`<div class="file">
  <button class="back" id="back">← All sites</button>
  <div><span class="pill ${s.tier[0]}">${s.tier} · #${s.rank}</span><h2>${s.nb}</h2><div class="meta">Ward ${s.ward} · ~200 m block around ${clean(s.addrs[0]?s.addrs[0][0]:'')} · last report ${new Date(s.last+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div></div>
  <div class="facts"><div><b>${s.n_recent}</b><span>reports since 2022</span></div><div><b>${s.last12}</b><span>last 12 months (prior: ${s.prev12})</span></div><div><b>${s.med_close??'–'}</b><span>median days to close</span></div></div>
  <div><h3>Recommended action</h3><div class="act">${s.actions.map(a=>`<div><b>${a[0]}</b><p>${a[1]}</p></div>`).join('')}</div></div>
  <div><h3>Reports per year</h3>${bars(yrs,yrs.map((_,k)=>"'"+String(18+k)),css('--t2'))}</div>
  <div><h3>Repeat addresses (since 2022)</h3><table>${s.addrs.map(a=>`<tr><td>${clean(a[0])}</td><td class="n">${a[1]}</td></tr>`).join('')}</table></div>
  ${s.w_n?`<div><h3>Witnessed dumping by weekday reported (${s.w_n})</h3>${bars(s.w_dow,['M','T','W','T','F','S','S'],css('--t3'),56)}<p class="note">Use these days to schedule patrols and to pull camera footage.</p></div>`:''}
  <div><h3>Report types</h3><table>${mix.map(([k,v])=>`<tr><td>${k}</td><td class="n">${v}</td></tr>`).join('')}</table></div>
  <div><h3>Conditions within ~300 m</h3><table><tr><td>City-owned (LRA) parcels</td><td class="n">${s.lra}</td></tr><tr><td>Vacant lots</td><td class="n">${s.vac_lot}</td></tr><tr><td>Registered vacant buildings</td><td class="n">${s.vac_bldg}</td></tr></table>
  ${vb.length?`<p class="note" style="margin-top:8px">Longest-vacant buildings nearby: ${vb.map(v=>`${clean(v[0])} (${v[1]} mo${v[2]?`, ${v[2]} major violations`:''})`).join('; ')}.</p>`:''}</div>
 </div>`;
 $('back').onclick=list;$('pane').scrollTop=0;
}
function openWatch(i){
 const w=D.watch[i];sel={type:'w',i};tabSet('watch',false);focus(w.lon,w.lat,Math.max(view.k,4));
 $('pane').innerHTML=`<div class="file"><button class="back" id="back">← Watch list</button>
  <div><span class="pill W">Watch list</span><h2>${w.nb}</h2><div class="meta">No dumping reports in the last 3 years</div></div>
  <div class="facts"><div><b>${w.p}%</b><span>est. chance of a first report within a year</span></div><div><b>${w.lra}</b><span>LRA parcels nearby</span></div><div><b>${w.vac_bldg}</b><span>vacant buildings nearby</span></div></div>
  <div><h3>Why it is flagged</h3><p class="note" style="font-size:14px">In 2026, quiet blocks like this one, surrounded by city-owned land and vacant buildings, got their first dumping report at about twice the rate of other quiet blocks. Counts cover roughly 300 m around the block.</p></div>
  <div><h3>Recommended action</h3><div class="act"><div><b>Prevent first</b><p>Mow and secure LRA frontage, board open vacant buildings, and add to the routine patrol loop before the first pile appears.</p></div></div></div>
 </div>`;$('back').onclick=list;$('pane').scrollTop=0;
}
function how(){
 const r=(k,i)=>Math.round(V[k][i]);
 $('pane').innerHTML=`<div class="how">
  <p><b>The test.</b> We trained the model on dumping reports through 2025, then asked it to rank every ~200 m block in the city for 2026, without showing it any 2026 data. Then we checked the ranking against the ${fmt(3008)} reports actually filed from January to October 2026.</p>
  <div><h3>Share of 2026 reports caught by the flagged blocks</h3><table class="vt">
   <tr><td></td><td class="n"><b>Top 1%</b></td><td class="n"><b>Top 5%</b></td><td class="n"><b>Top 10%</b></td></tr>
   <tr><td><b>DumpWatch model</b></td><td class="n">${r('model',0)}%</td><td class="n"><b>${r('model',1)}%</b></td><td class="n">${r('model',2)}%</td></tr>
   <tr><td>Where it happened last year</td><td class="n">${r('last year only',0)}%</td><td class="n">${r('last year only',1)}%</td><td class="n">${r('last year only',2)}%</td></tr>
   <tr><td>Random blocks</td><td class="n">1%</td><td class="n">5%</td><td class="n">10%</td></tr></table></div>
  <p><b>The watch list.</b> Separately, among blocks with no reports in 2023–2025, the ones scored highest for nearby LRA land and vacant buildings got a first report in 2026 at about twice the rate of other quiet blocks (29% vs 15% for the top fifth).</p>
  <p><b>What goes into the score.</b> Each block's dumping history over 1–5 years, its neighbors' history, the mix of report types, and nearby city-owned land, vacant lots and registered vacant buildings.</p>
  <div><h3>Limits</h3><p class="note" style="font-size:13px">311 reports measure where dumping gets reported, not every dump. About 28% are logged by City staff, so patrolled areas are over-represented. Timestamps record the report, not the dump. The City appears to have changed how it codes vacant-lot and vacant-building debris after 2022. Police dumping reports are not in this data.</p></div>
  <p class="note">Sources: City of St. Louis Open Data — CSB Service Requests (311), Assessor parcels, LRA inventory, vacant building registry, streets and neighborhood boundaries.</p>
 </div>`}
function tabSet(t,render=true){tab=t;['act','watch','how'].forEach(k=>$('t-'+k).setAttribute('aria-selected',k===t));if(render)list()}
['act','watch','how'].forEach(k=>$('t-'+k).onclick=()=>tabSet(k));
window.addEventListener('resize',()=>{size();if(sel){const o=sel.type==='s'?D.sites[sel.i]:D.watch[sel.i];focus(o.lon,o.lat,view.k)}else{view={k:1,tx:0,ty:0};draw()}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
size();list();
</script>
